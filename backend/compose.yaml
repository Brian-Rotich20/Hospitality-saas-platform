# Local development stack: PostgreSQL, Redis, API and worker.
#   docker compose up --build
# Uses .env for secrets; DATABASE_URL/REDIS_URL are overridden to the local containers.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: linkmart
      POSTGRES_PASSWORD: linkmart
      POSTGRES_DB: linkmart
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkmart"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  migrate:
    build: .
    command: ["node", "dist/scripts/migrate.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://linkmart:linkmart@postgres:5432/linkmart
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://linkmart:linkmart@postgres:5432/linkmart
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://linkmart:linkmart@postgres:5432/linkmart
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

volumes:
  pgdata:
